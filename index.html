<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Your photo</title>
  <style>
    :root {
      --white: #ffffff;
      --ink: #141414;
      --ink-soft: #6b6b6b;
      --rule: #e6e4e0;
      --red: #c73a2f;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--white);
      color: var(--ink);
      padding: calc(env(safe-area-inset-top, 0px) + 28px) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .tag {
      font-size: 12px;
      letter-spacing: .24em;
      color: var(--ink-soft);
      margin: 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin: 0;
    }

    /* Photo / live-video stage */
    .stage {
      position: relative;
      display: block;
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(20, 20, 20, .14);
      background: #f4f3f0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .stage.has-video {
      touch-action: none;
      cursor: pointer;
    }

    .stage img,
    .stage video {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      background: #f4f3f0;
    }

    .stage video {
      position: absolute;
      inset: 0;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
    }

    .stage.playing img {
      opacity: 0;
      transition: opacity .15s ease;
    }

    .stage.playing video {
      opacity: 1;
    }

    .live-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 8px;
      border-radius: 999px;
      background: rgba(20, 20, 20, .55);
      color: var(--white);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      pointer-events: none;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--white);
    }

    .stage.has-video:not(.playing) .live-dot {
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    .hint {
      margin: -6px 0 0;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .actions {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .02em;
      font-family: inherit;
      cursor: pointer;
      background: var(--red);
      color: var(--white);
      transition: transform .18s cubic-bezier(.34, 1.56, .64, 1), opacity .15s ease;
    }

    .btn:active {
      transform: scale(.97);
      opacity: .85;
    }

    .btn.secondary {
      background: var(--ink);
    }

    .btn.outline {
      background: none;
      color: var(--ink);
      border: 1px solid var(--ink);
      font-size: 16px;
      padding: 15px 24px;
    }

    .status {
      min-height: 22px;
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink-soft);
      max-width: 420px;
    }

    .status.ok {
      color: #2f7d4f;
      font-weight: 600;
    }

    .status.warn {
      color: var(--red);
    }

    .note {
      margin: 0;
      font-size: 13px;
      color: var(--ink-soft);
      max-width: 420px;
      line-height: 1.5;
    }

    /* Empty state for a photo that's gone (deleted / expired / bad link) */
    .empty {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 40px 20px;
      background: #f4f3f0;
      border-radius: 10px;
    }

    .empty .icon {
      font-size: 40px;
      line-height: 1;
    }

    @media (min-width: 700px) {
      h1 {
        font-size: 40px;
      }

      .stage,
      .actions,
      .status,
      .note,
      .empty {
        max-width: 520px;
      }
    }
  </style>
</head>

<body>
  <p class="tag" id="tag">YOUR PHOTO</p>
  <h1 id="title">Your photo is ready</h1>

  <div class="stage" id="stage" hidden>
    <img id="img" alt="Your photo">
    <video id="vid" muted loop playsinline preload="none" hidden></video>
    <div class="live-badge" id="liveBadge" hidden>
      <span class="live-dot"></span>LIVE
    </div>
  </div>

  <p class="hint" id="hint" hidden>Press and hold the photo to play</p>

  <div class="empty" id="empty" hidden>
    <div class="icon">📷</div>
    <div>This photo doesn't exist anymore.</div>
  </div>

  <div class="actions" id="actions" hidden>
    <button class="btn" id="dlPhoto" type="button">Download photo</button>
    <button class="btn secondary" id="dlVideo" type="button" hidden>Download video</button>
    <button class="btn outline" id="share" type="button" hidden>Share / Save to Photos</button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="note" id="note" hidden></p>

  <script>
    (function () {
      // Only media from the hosts the booth uploads to can be shown here.
      var ALLOWED = /^(i\.ibb\.co|res\.cloudinary\.com)$/i;

      function parseMediaUrl(raw) {
        raw = (raw || '').trim();
        if (!raw) return null;
        try {
          if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
          var u = new URL(raw);
          if (u.protocol === 'https:' && ALLOWED.test(u.hostname)) return u.href;
        } catch (e) { }
        return null;
      }

      function getExt(url, fallback) {
        try {
          var path = new URL(url).pathname;
          var m = /\.([a-z0-9]{2,4})$/i.exec(path);
          if (m) return m[1].toLowerCase();
        } catch (e) { }
        return fallback;
      }

      var q = new URLSearchParams(location.search);
      var brand = (q.get('b') || '').trim().slice(0, 30);
      var hours = parseInt(q.get('e'), 10);
      var photoUrl = parseMediaUrl(q.get('i'));
      var videoUrl = parseMediaUrl(q.get('v'));

      var $ = function (id) { return document.getElementById(id); };
      var statusEl = $('status');
      function setStatus(msg, cls) { statusEl.textContent = msg || ''; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }

      if (brand) { document.title = brand + ' · your photo'; $('tag').textContent = brand.toUpperCase(); }

      if (!photoUrl) {
        $('title').textContent = 'Link not valid';
        setStatus('This link doesn\'t look right. Please scan the QR code on the booth again.', 'warn');
        return;
      }

      var slug = (brand || 'photo').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'photo';
      var photoFileName = slug + '.' + getExt(photoUrl, 'jpg');
      var videoFileName = slug + '-live.' + getExt(videoUrl, 'mp4');
      var directPhoto = /\/upload\/fl_attachment/.test(photoUrl); // Cloudinary link that already forces a download
      var directVideo = videoUrl ? /\/upload\/fl_attachment/.test(videoUrl) : false;

      var gone = false;   // true once we learn the photo no longer exists
      var videoOk = false; // true once the video has proven it actually loads

      var stage = $('stage'), img = $('img'), vid = $('vid');

      function showGone() {
        if (gone) return;
        gone = true;
        $('title').textContent = 'Photo not found';
        stage.hidden = true;
        $('empty').hidden = false;
        $('actions').hidden = true;
        $('note').hidden = true;
        $('hint').hidden = true;
        setStatus('It may have expired or already been deleted. Please check with the booth if you still need it.', 'warn');
      }

      // Some hosts (imgbb included) don't 404 a deleted image — they serve an
      // actual "image not found" graphic at the same URL with a normal 200.
      // We can't tell from the HTTP status, so we look at the pixels instead:
      // that kind of graphic is basically a flat color block with a bit of
      // text, while a real booth photo has far more color variation.
      function looksLikePlaceholder(imgEl) {
        try {
          var w = 32, h = 32;
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.drawImage(imgEl, 0, 0, w, h);
          var data = ctx.getImageData(0, 0, w, h).data;
          var n = w * h, sum = 0, sumSq = 0;
          for (var i = 0; i < data.length; i += 4) {
            var lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            sum += lum; sumSq += lum * lum;
          }
          var mean = sum / n;
          var stddev = Math.sqrt(Math.max(sumSq / n - mean * mean, 0));
          var ratio = imgEl.naturalWidth / imgEl.naturalHeight;
          var squarish = ratio > 0.9 && ratio < 1.1;
          return stddev < 12 || (squarish && stddev < 35);
        } catch (e) {
          return false; // couldn't analyze (e.g. blocked by CORS) — assume it's real
        }
      }

      img.crossOrigin = 'anonymous';
      img.addEventListener('error', showGone);
      img.addEventListener('load', function () {
        if (this.naturalWidth === 0 || this.naturalHeight === 0) { showGone(); return; }
        if (looksLikePlaceholder(this)) showGone();
      });

      img.src = photoUrl;
      stage.hidden = false;
      $('actions').hidden = false;

      if (hours > 0) {
        $('note').textContent = 'This ' + (videoUrl ? 'photo and video are' : 'photo is') + ' deleted automatically after ' + hours + (hours === 1 ? ' hour' : ' hours') + ', so download ' + (videoUrl ? 'them' : 'it') + ' now.';
        $('note').hidden = false;
      }

      // ---- Live video preview (press and hold, like a Live Photo) ----
      if (videoUrl) {
        vid.src = videoUrl;
        vid.hidden = false;

        vid.addEventListener('loadeddata', function () {
          videoOk = true;
          stage.classList.add('has-video');
          $('liveBadge').hidden = false;
          $('hint').hidden = false;
          $('title').textContent = 'Your live photo is ready';
        });
        vid.addEventListener('error', function () {
          // Video is broken — quietly fall back to a plain photo.
          videoOk = false;
        });

        var holding = false;
        function startHold(e) {
          if (!videoOk || gone) return;
          e.preventDefault();
          holding = true;
          stage.classList.add('playing');
          try { vid.currentTime = 0; } catch (e2) { }
          var p = vid.play();
          if (p && p.catch) p.catch(function () { });
        }
        function endHold() {
          if (!holding) return;
          holding = false;
          stage.classList.remove('playing');
          vid.pause();
        }
        stage.addEventListener('pointerdown', startHold);
        stage.addEventListener('pointerup', endHold);
        stage.addEventListener('pointercancel', endHold);
        stage.addEventListener('pointerleave', endHold);
        stage.addEventListener('contextmenu', function (e) { if (videoOk) e.preventDefault(); });
      }

      // Fetch the media in the background so the buttons respond instantly.
      var photoBlobPromise = fetch(photoUrl, { mode: 'cors', credentials: 'omit' })
        .then(function (r) {
          if (r.status === 404 || r.status === 410) showGone();
          if (!r.ok) throw new Error('bad response');
          return r.blob();
        })
        .catch(function () { return null; });

      var videoBlobPromise = videoUrl
        ? fetch(videoUrl, { mode: 'cors', credentials: 'omit' })
          .then(function (r) { if (!r.ok) throw new Error('bad response'); return r.blob(); })
          .catch(function () { return null; })
        : Promise.resolve(null);

      if (videoUrl) {
        videoBlobPromise.then(function (blob) { if (blob) $('dlVideo').hidden = false; });
      }

      function saveBlob(blob, name) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      }

      function fallback(url) {
        if (gone) return;
        setStatus('Press and hold the media, then choose “Download” (or “Save”).', 'warn');
        window.open(url, '_blank');
      }

      $('dlPhoto').addEventListener('click', function () {
        if (gone) return;
        if (directPhoto) {
          setStatus('Downloading photo…', 'ok');
          window.location.href = photoUrl;
          return;
        }
        setStatus('Saving photo…');
        photoBlobPromise.then(function (blob) {
          if (gone) return;
          if (blob) { saveBlob(blob, photoFileName); setStatus('Photo saved! Check your Downloads or Gallery.', 'ok'); }
          else fallback(photoUrl);
        });
      });

      $('dlVideo').addEventListener('click', function () {
        if (gone || !videoUrl) return;
        if (directVideo) {
          setStatus('Downloading video…', 'ok');
          window.location.href = videoUrl;
          return;
        }
        setStatus('Saving video…');
        videoBlobPromise.then(function (blob) {
          if (blob) { saveBlob(blob, videoFileName); setStatus('Video saved! Check your Downloads or Gallery.', 'ok'); }
          else fallback(videoUrl);
        });
      });

      // "Share / Save to Photos" — shares the photo, and the video too when
      // the device supports sharing multiple files at once; falls back to
      // photo-only where that's not supported.
      photoBlobPromise.then(function (photoBlob) {
        if (gone || !photoBlob || !navigator.canShare) return;

        function tryShare(files) {
          if (!files.length) return;
          if (!navigator.canShare({ files: files })) return;
          $('share').hidden = false;
          $('share').onclick = function () {
            setStatus('Opening share sheet…');
            navigator.share({ files: files })
              .then(function () { setStatus('Saved! Check your Photos or the app you shared to.', 'ok'); })
              .catch(function (err) {
                if (err && err.name === 'AbortError') { setStatus(''); return; }
                setStatus('Couldn\'t share — try the download buttons instead.', 'warn');
              });
          };
        }

        var photoFile;
        try { photoFile = new File([photoBlob], photoFileName, { type: photoBlob.type || 'image/jpeg' }); } catch (e) { return; }

        if (videoUrl) {
          videoBlobPromise.then(function (videoBlob) {
            if (videoBlob) {
              try {
                var videoFile = new File([videoBlob], videoFileName, { type: videoBlob.type || 'video/mp4' });
                if (navigator.canShare({ files: [photoFile, videoFile] })) { tryShare([photoFile, videoFile]); return; }
              } catch (e) { }
            }
            tryShare([photoFile]);
          });
        } else {
          tryShare([photoFile]);
        }
      });
    })();
  </script>
</body>

</html>
